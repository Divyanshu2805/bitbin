name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # The Prisma client is generated, not committed; some tests import it
      - name: Generate the Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/bitbin

      - name: Tests with coverage floor
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Placeholders are enough to build; the tests mock every service
          DATABASE_URL: postgresql://user:pass@localhost:5432/bitbin
          AUTH_SECRET: ci-placeholder-secret
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: re_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_ID_MONTHLY: price_placeholder
          STRIPE_PRICE_ID_YEARLY: price_placeholder
          OPENAI_API_KEY: placeholder

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
