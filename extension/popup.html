<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save to BitBin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* A fixed popup: the header and the Save row stay put and the form between them scrolls */
    html { height: 560px; }
    body { width: 460px; height: 560px; display: flex; flex-direction: column; overflow: hidden; }
    form#form { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    form#form > main { flex: 1; min-height: 0; overflow-y: auto; align-content: start; }
    body > .panel { flex: 1; align-content: center; }
    /* Opened as a window (from the context menu): it fills the window */
    html.window, html.window body { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <header>
    <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs><linearGradient id="clay" x1="16" y1="9" x2="16" y2="29.2" gradientUnits="userSpaceOnUse"><stop offset="0" class="logo-stop-a"/><stop offset="1" class="logo-stop-b"/></linearGradient></defs>
      <rect x="3.5" y="9" width="25" height="3.4" rx="1.7" class="logo-lid" fill="url(#clay)"/>
      <rect x="13.5" y="1.5" width="5" height="5" rx="1.2" class="logo-bit"/>
      <g class="logo-bin">
        <path d="M6 14h20l-1.7 13.1a2.4 2.4 0 0 1-2.38 2.1H10.08a2.4 2.4 0 0 1-2.38-2.1L6 14Z" fill="url(#clay)"/>
        <g class="logo-eyes"><rect x="10.2" y="17" width="3.6" height="3.6" rx="0.8" class="logo-face"/><rect x="18.2" y="17" width="3.6" height="3.6" rx="0.8" class="logo-face"/></g>
        <rect x="14.2" y="22.2" width="3.6" height="3.6" rx="0.8" class="logo-face logo-mouth"/>
      </g>
    </svg>
    <h1>Save to BitBin</h1>
    <span class="eyebrow">Pro</span>
  </header>

  <div id="loading" class="panel"><p>Loading…</p></div>

  <div id="setup" class="panel" hidden>
    <p id="setup-message">Connect the extension to your BitBin account first.</p>
    <button id="open-options" class="primary" type="button">Open options</button>
  </div>

  <div id="done" class="panel" hidden>
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p><strong>Saved to BitBin.</strong></p>
    <button id="open-bitbin" class="link" type="button">Open BitBin</button>
  </div>

  <form id="form" hidden>
    <main>
      <label id="type-field">Type
        <select id="type"></select>
      </label>

      <div class="field">
        <div class="field-head">
          <label for="collection">Collection</label>
          <button id="show-new-collection" class="link" type="button">+ New</button>
        </div>
        <select id="collection">
          <option value="">No collection</option>
        </select>
      </div>

      <div id="new-collection" class="new-collection" hidden>
        <input id="new-collection-name" maxlength="100" placeholder="Collection name" aria-label="New collection name">
        <button id="create-collection" class="primary" type="button">Create</button>
        <button id="cancel-collection" type="button" aria-label="Cancel">×</button>
      </div>

      <label>Title
        <input id="title" required maxlength="200">
      </label>

      <label id="language-field">Language
        <select id="language"></select>
      </label>

      <label id="content-field">Content
        <textarea id="content" spellcheck="false"></textarea>
      </label>

      <label id="url-field">URL
        <input id="url" type="url" placeholder="https://">
      </label>

      <div class="field">
        <label for="tags">Tags</label>
        <div class="tags-row">
          <div id="tag-box" class="tag-box">
            <input id="tags" placeholder="Type a tag, press Enter" autocomplete="off">
          </div>
          <button id="suggest" type="button" title="Suggest tags and a description with AI">✦ Suggest</button>
        </div>
      </div>

      <label>Description
        <textarea id="description" class="description" maxlength="900" placeholder="Optional. ✦ Suggest writes one for you."></textarea>
      </label>

      <div id="source" class="source"></div>

    </main>

    <footer class="foot">
      <div id="status" class="status" role="status"></div>

      <div class="actions">
        <span class="hint">Ctrl+Enter to save</span>
        <button id="save" class="primary" type="submit">Save</button>
      </div>
    </footer>
  </form>

  <script type="module" src="popup.js"></script>
</body>
</html>
