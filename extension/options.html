<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BitBin extension options</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; font-size: 14px; }
    .wrap { max-width: 580px; margin: 0 auto; padding: 48px 16px; animation: page-in 0.42s var(--ease) both; }
    .wrap > .eyebrow { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.2em; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--card-radius); overflow: hidden; }
    .card main { padding: 20px; gap: 18px; }
    h2 { margin: 0 0 8px; font-size: 38px; line-height: 1.1; }
    p.lead { margin: 0 0 28px; color: var(--muted-foreground); font-size: 15px; }
    ol { margin: 0; padding-left: 18px; color: var(--muted-foreground); display: grid; gap: 4px; }
    ol strong { color: var(--foreground); font-weight: 600; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    code { font-family: var(--mono); font-size: 12px; color: var(--foreground); }
    .lead kbd { font-size: 12px; }
    #token { font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Extension</p>
    <h2>Save from anywhere</h2>
    <p class="lead">Select text on any page, press <kbd id="shortcut">Ctrl+Shift+B</kbd>, and it goes into your BitBin.</p>

    <div class="card">
      <header>
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs><linearGradient id="clay" x1="16" y1="9" x2="16" y2="29.2" gradientUnits="userSpaceOnUse"><stop offset="0" class="logo-stop-a"/><stop offset="1" class="logo-stop-b"/></linearGradient></defs>
      <rect x="3.5" y="9" width="25" height="3.4" rx="1.7" class="logo-lid" fill="url(#clay)"/>
      <rect x="13.5" y="1.5" width="5" height="5" rx="1.2" class="logo-bit"/>
      <g class="logo-bin">
        <path d="M6 14h20l-1.7 13.1a2.4 2.4 0 0 1-2.38 2.1H10.08a2.4 2.4 0 0 1-2.38-2.1L6 14Z" fill="url(#clay)"/>
        <g class="logo-eyes"><rect x="10.2" y="17" width="3.6" height="3.6" rx="0.8" class="logo-face"/><rect x="18.2" y="17" width="3.6" height="3.6" rx="0.8" class="logo-face"/></g>
        <rect x="14.2" y="22.2" width="3.6" height="3.6" rx="0.8" class="logo-face logo-mouth"/>
      </g>
    </svg>
        <h1>Connect your account</h1>
        <span class="eyebrow">Pro</span>
      </header>
      <form id="form">
        <main>
          <ol>
            <li>Open BitBin → <strong>Settings</strong> → <strong>Browser extension</strong>.</li>
            <li>Create a token and copy it. It's shown only once.</li>
            <li>Paste it below and save.</li>
          </ol>

          <label>BitBin site
            <select id="base-url"></select>
          </label>

          <label>API token
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="bb_…">
          </label>

          <div id="status" class="status" role="status"></div>

          <div class="buttons">
            <button id="save" class="primary" type="submit">Save and test</button>
            <button id="open-settings" type="button">Open BitBin settings</button>
            <button id="shortcuts" type="button">Change shortcut</button>
          </div>
        </main>
      </form>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
