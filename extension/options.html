<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BitBin extension options</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .card main { padding: 18px; gap: 16px; }
    h2 { margin: 0 0 4px; font-size: 20px; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    ol { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    code, kbd { font-family: var(--mono); font-size: 12px; color: var(--fg); }
    kbd { border: 1px solid var(--input); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
    #token { font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow" style="font: 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--lime); margin: 0 0 8px;">Extension</p>
    <h2>Save from anywhere</h2>
    <p class="lead">Select text on any page, press <kbd id="shortcut">Ctrl+Shift+B</kbd>, and it goes into your BitBin.</p>

    <div class="card">
      <header>
        <img src="icons/icon-32.png" alt="">
        <h1>Connect your account</h1>
        <span class="eyebrow">Pro</span>
      </header>
      <form id="form">
        <main>
          <ol>
            <li>Open BitBin → <strong>Settings</strong> → <strong>Browser extension</strong>.</li>
            <li>Create a token and copy it. It's shown only once.</li>
            <li>Paste it below and save.</li>
          </ol>

          <label>BitBin site
            <select id="base-url"></select>
          </label>

          <label>API token
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="bb_…">
          </label>

          <div id="status" class="status" role="status"></div>

          <div class="buttons">
            <button id="save" class="primary" type="submit">Save and test</button>
            <button id="open-settings" type="button">Open BitBin settings</button>
            <button id="shortcuts" type="button">Change shortcut</button>
          </div>
        </main>
      </form>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
